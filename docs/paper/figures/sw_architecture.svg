<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="dep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a9a9a"/>
    </marker>
    <marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .band-title { font-size: 15px; font-weight: bold; fill: #222; }
      .band-sub { font-size: 12px; fill: #555; }
      .chip { fill: #fff; stroke-width: 1.2; }
      .chip-text { font-size: 14px; fill: #222; text-anchor: middle; dominant-baseline: central; }
      .chip-main { font-size: 14px; fill: #222; text-anchor: middle; }
      .chip-sub { font-size: 11.5px; fill: #666; text-anchor: middle; }
      .dep { stroke: #9a9a9a; stroke-width: 1.6; fill: none; marker-end: url(#dep); }
      .flow { stroke: #333; stroke-width: 1.6; fill: none; marker-end: url(#flow); }
      .flow2 { stroke: #333; stroke-width: 1.6; fill: none; marker-start: url(#flow); marker-end: url(#flow); }
      .flow-label { font-size: 11.5px; fill: #333; }
    </style>
  </defs>

  <rect width="1120" height="560" fill="#fff"/>

  <!-- ===== Layers ===== -->
  <!-- User interface -->
  <rect x="210" y="30" width="700" height="100" rx="8" fill="#e8f0fb" stroke="#6a8fc7" stroke-width="1.4"/>
  <text x="226" y="54" class="band-title">User interface</text>
  <text x="340" y="54" class="band-sub">Tkinter</text>
  <rect x="226" y="70" width="158" height="44" rx="5" class="chip" stroke="#6a8fc7"/>
  <text x="305" y="92" class="chip-text">Video view</text>
  <rect x="396" y="70" width="158" height="44" rx="5" class="chip" stroke="#6a8fc7"/>
  <text x="475" y="92" class="chip-text">Diagram</text>
  <rect x="566" y="70" width="158" height="44" rx="5" class="chip" stroke="#6a8fc7"/>
  <text x="645" y="92" class="chip-text">Timelines</text>
  <rect x="736" y="70" width="158" height="44" rx="5" class="chip" stroke="#6a8fc7"/>
  <text x="815" y="92" class="chip-text">Parameters &amp; notes</text>

  <!-- Services -->
  <rect x="210" y="150" width="700" height="100" rx="8" fill="#eaf5ec" stroke="#6fa77a" stroke-width="1.4"/>
  <text x="226" y="174" class="band-title">Services</text>
  <text x="300" y="174" class="band-sub">use cases</text>
  <rect x="226" y="190" width="158" height="44" rx="5" class="chip" stroke="#6fa77a"/>
  <text x="305" y="212" class="chip-text">Open project</text>
  <rect x="396" y="190" width="158" height="44" rx="5" class="chip" stroke="#6fa77a"/>
  <text x="475" y="212" class="chip-text">Annotate</text>
  <rect x="566" y="190" width="158" height="44" rx="5" class="chip" stroke="#6fa77a"/>
  <text x="645" y="212" class="chip-text">Save</text>
  <rect x="736" y="190" width="158" height="44" rx="5" class="chip" stroke="#6fa77a"/>
  <text x="815" y="212" class="chip-text">Analyze</text>

  <!-- Adapters -->
  <rect x="210" y="270" width="700" height="100" rx="8" fill="#fdf1e3" stroke="#cf9a55" stroke-width="1.4"/>
  <text x="226" y="294" class="band-title">Adapters</text>
  <text x="302" y="294" class="band-sub">file and library I/O</text>
  <rect x="226" y="310" width="158" height="44" rx="5" class="chip" stroke="#cf9a55"/>
  <text x="305" y="328" class="chip-main">Frames</text>
  <text x="305" y="345" class="chip-sub">ffmpeg · buffer</text>
  <rect x="396" y="310" width="158" height="44" rx="5" class="chip" stroke="#cf9a55"/>
  <text x="475" y="328" class="chip-main">Working state</text>
  <text x="475" y="345" class="chip-sub">SQLite</text>
  <rect x="566" y="310" width="158" height="44" rx="5" class="chip" stroke="#cf9a55"/>
  <text x="645" y="328" class="chip-main">Export</text>
  <text x="645" y="345" class="chip-sub">CSV · JSON</text>
  <rect x="736" y="310" width="158" height="44" rx="5" class="chip" stroke="#cf9a55"/>
  <text x="815" y="328" class="chip-main">Reports</text>
  <text x="815" y="345" class="chip-sub">Plotly · HTML</text>

  <!-- Domain -->
  <rect x="930" y="30" width="170" height="340" rx="8" fill="#f1ecf7" stroke="#8e77b5" stroke-width="1.4"/>
  <text x="946" y="54" class="band-title">Domain</text>
  <text x="1012" y="54" class="band-sub">pure rules</text>
  <rect x="946" y="70" width="138" height="44" rx="5" class="chip" stroke="#8e77b5"/>
  <text x="1015" y="92" class="chip-text">Frame records</text>
  <rect x="946" y="128" width="138" height="44" rx="5" class="chip" stroke="#8e77b5"/>
  <text x="1015" y="150" class="chip-text">Zone hit test</text>
  <rect x="946" y="186" width="138" height="44" rx="5" class="chip" stroke="#8e77b5"/>
  <text x="1015" y="208" class="chip-text">Touch episodes</text>
  <rect x="946" y="244" width="138" height="44" rx="5" class="chip" stroke="#8e77b5"/>
  <text x="1015" y="266" class="chip-text">Statistics</text>
  <text x="1015" y="330" class="band-sub" text-anchor="middle">no files, GUI</text>
  <text x="1015" y="346" class="band-sub" text-anchor="middle">or plotting</text>

  <!-- Dependency arrows (grey) -->
  <line x1="560" y1="131" x2="560" y2="148" class="dep"/>
  <line x1="560" y1="251" x2="560" y2="268" class="dep"/>
  <line x1="911" y1="80" x2="928" y2="80" class="dep"/>
  <line x1="911" y1="200" x2="928" y2="200" class="dep"/>
  <line x1="911" y1="320" x2="928" y2="320" class="dep"/>

  <!-- ===== Project folder ===== -->
  <rect x="210" y="420" width="700" height="110" rx="8" fill="#f4f4f4" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="226" y="516" class="band-title">Project folder</text>
  <text x="340" y="516" class="band-sub" font-family="Consolas, Menlo, monospace">data/&lt;video&gt;/</text>
  <rect x="226" y="434" width="158" height="48" rx="5" class="chip" stroke="#999"/>
  <text x="305" y="453" class="chip-main">frames/</text>
  <text x="305" y="471" class="chip-sub">one JPEG per frame</text>
  <rect x="396" y="434" width="158" height="48" rx="5" class="chip" stroke="#999"/>
  <text x="475" y="453" class="chip-main">state/</text>
  <text x="475" y="471" class="chip-sub">SQLite database</text>
  <rect x="566" y="434" width="158" height="48" rx="5" fill="#fff3cf" stroke="#c98a00" stroke-width="2.6"/>
  <text x="645" y="453" class="chip-main" font-weight="bold">export/</text>
  <text x="645" y="471" class="chip-sub" fill="#6b4a00">CSV + JSON metadata</text>
  <text x="645" y="500" class="flow-label" text-anchor="middle" font-weight="bold" fill="#9a6a00">main output</text>
  <rect x="736" y="434" width="158" height="48" rx="5" class="chip" stroke="#999"/>
  <text x="815" y="453" class="chip-main">plots/</text>
  <text x="815" y="471" class="chip-sub">HTML report</text>

  <!-- Data-flow arrows (dark) -->
  <line x1="305" y1="431" x2="305" y2="357" class="flow"/>
  <text x="313" y="400" class="flow-label">read</text>
  <line x1="475" y1="357" x2="475" y2="431" class="flow2"/>
  <text x="483" y="400" class="flow-label">load / save</text>
  <line x1="645" y1="357" x2="645" y2="431" class="flow2"/>
  <text x="653" y="400" class="flow-label">write / read</text>
  <line x1="815" y1="357" x2="815" y2="431" class="flow"/>
  <text x="823" y="400" class="flow-label">write</text>

  <!-- ===== External ===== -->
  <rect x="20" y="66" width="140" height="52" rx="6" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="90" y="87" class="chip-main">Annotator</text>
  <text x="90" y="104" class="chip-sub">mouse &amp; keyboard</text>
  <line x1="161" y1="92" x2="207" y2="92" class="flow"/>

  <rect x="20" y="432" width="140" height="52" rx="6" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="90" y="453" class="chip-main">Video file</text>
  <text x="90" y="470" class="chip-sub">mp4, mov, avi …</text>
  <line x1="161" y1="458" x2="223" y2="458" class="flow"/>
  <text x="168" y="450" class="flow-label">extract</text>
</svg>
